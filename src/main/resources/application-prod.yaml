# Configurações específicas para ambiente de produção
spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update

  h2:
    console:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  initial-admin:
    email: ${INITIAL_ADMIN_EMAIL}
    password: ${INITIAL_ADMIN_PASSWORD}
