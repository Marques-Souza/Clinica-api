services:
  postgres:
    image: postgres:17-alpine
    container_name: clinica-postgres
    environment:
      POSTGRES_DB: clinica
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clinica"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: clinica-api
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/clinica
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: 0123456789-0123456789-0123456789
      SPRING_PROFILES_ACTIVE: prod
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin.demo@clinica.com}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-ClinicaDemo@2026!}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
