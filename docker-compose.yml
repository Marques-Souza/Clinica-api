services:
  postgres:
    image: postgres:17-alpine
    container_name: clinica-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clinica}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clinica"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: clinica-api
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-clinica}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-local-only-secret-change-before-use-123456}
      SPRING_PROFILES_ACTIVE: dev
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin.demo@clinica.com}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-ClinicaDemo@2026!}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
      MAIL_FROM: ${MAIL_FROM:-${MAIL_USERNAME:-no-reply@clinica.local}}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
